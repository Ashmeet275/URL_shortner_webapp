<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ash URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-200 text-stone-800 font-sans min-h-screen 
flex flex-col items-center justify-center p-6">
    
    <div class="max-w-4xl w-full"> <h1 class="text-3xl font-bold text-center 
        text-amber-950 mb-6 drop-shadow-sm">
            Ashmeet's URL Shortener
        </h1>
        
        <form method="POST" class="bg-stone-50 shadow-lg border border-stone-200 
        rounded-xl p-8 space-y-5 max-w-md mx-auto mb-10">
            <div>
                <label for="url" class="block text-stone-700 font-semibold mb-2">
                    Enter the long URL:
                </label>
                <input type="text" name="url" 
                placeholder="https://example.com/very-long-link..." 
                    class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-700 
                    focus:border-amber-700 bg-white placeholder-stone-400 transition-colors">
            </div>
            
            <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-2.5 px-4 
            rounded-md transition-colors shadow-sm">
                Shorten URL
            </button>
        </form>

        <h2 class="text-xl font-semibold text-center text-amber-950 mt-6 mb-4 drop-shadow-sm">
            Shortened URLs
        </h2>
        
        {% if all_urls %}
            <div class="bg-stone-50 shadow-lg border border-stone-200 rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full table-auto border-collapse text-sm text-left">
                        <thead class="bg-stone-100 text-stone-700 border-b border-stone-300">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Short URL</th>
                                <th class="px-6 py-4 font-semibold">Original URL</th>
                                <th class="px-6 py-4 font-semibold text-center">Clicks</th>
                                <th class="px-6 py-4 font-semibold text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-stone-200">
                            {% for url in all_urls %}
                                <tr class="hover:bg-stone-100/50 transition-colors">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <a href="/{{url[1]}}" target="_blank" class="text-amber-700 hover:text-amber-900 
                                        font-medium hover:underline">
                                            http://127.0.0.1:5000/{{url[1]}}
                                        </a>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="max-w-xs md:max-w-md truncate text-stone-600" title="{{url[0]}}">
                                            {{url[0]}}
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-center text-stone-600 font-medium">
                                        {{url[2]}}
                                    </td>
                                    <td class="px-6 py-4 text-center text-stone-600">
                                        <span class="text-xs text-stone-400">
                                            <form action="/delete/{{url[1]}}",
                                            method="POST",
                                            onsubmit="return confirm('Delete this URL')">
                                            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white 
                                            font-bold py-1 px-3 rounded-md transition-colors shadow-sm">
                                                Delete
                                            </button>
                                            </form>
                                        </span>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        {% else %}
            <p class="text-center text-stone-500 bg-stone-50 shadow-sm border border-stone-200 rounded-xl p-6 max-w-md mx-auto">
                No shortened URLs available yet.
            </p>
        {% endif %}
    </div>

</body>
</html>
